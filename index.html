<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCraftCISTiers — PvP Ranking Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-container">
            <span class="logo-text" onclick="switchScreen('main')">MultiCraftCISTiers</span>
            <button class="menu-toggle-btn" onclick="toggleMobileMenu()">Меню</button>
            <nav class="nav-menu" id="nav-menu">
                <a href="#" onclick="switchScreen('main'); toggleMobileMenu(); return false;">Рейтинг</a>
                <a href="#" onclick="switchScreen('testers'); toggleMobileMenu(); return false;">Тестеры</a>
                <a href="#" onclick="switchScreen('wiki'); toggleMobileMenu(); return false;">Вики</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        
        <div id="main-screen" class="screen-content">
            
            <div class="promo-box">
                <h1 class="main-title-custom">OVERALL PVP TOP</h1>
                <p class="promo-description">
                    Официальная PvP ranking platform СНГ комьюнити MultiCraftCISTiers. 
                    Проходите тир-тесты, попадайте в рейтинги и поднимайтесь до высших PVP тиров.
                </p>
                <a href="https://t.me/ваша_ссылка" target="_blank" class="tg-btn">Telegram</a>
            </div>

            <div class="filters-panel">
                <input type="text" id="search-input" placeholder="Поиск игрока..." class="search-field">
                
                <div class="select-wrapper">
                    <select id="kit-filter" class="filter-select">
                        <option value="Overall">⚡ Все режимы (Overall)</option>
                        <option value="Hardcore">❤️ Hardcore Kit</option>
                        <option value="Manhunt">🪣 Manhunt Kit</option>
                        <option value="Diamond">💎 Diamond Kit</option>
                        <option value="Beast">⚔️ Beast Kit</option>
                        <option value="Emerald">🟢 Emerald Kit</option>
                        <option value="Emerald Pot">🧪 Emerald Pot Kit</option>
                        <option value="RVM">🩸 RVM Kit</option>
                        <option value="Dragonhide">🛡️ Dragonhide Kit</option>
                        <option value="Pickaxe">⛏️ Pickaxe Kit</option>
                        <option value="Combo">🥊 Combo Kit</option>
                        <option value="Gapple">🍏 Gapple Kit</option>
                        <option value="Mace">🔨 Mace Kit</option>
                        <option value="Crystal">💥 Crystal Kit</option>
                        <option value="SMP">🌍 SMP Kit</option> </select>
                </div>

                <div class="select-wrapper">
                    <select id="region-filter" class="filter-select">
                        <option value="All">🌍 Все регионы СНГ</option>
                        <option value="RU">RU</option>
                        <option value="UA">UA</option>
                        <option value="BY">BY</option>
                        <option value="KZ">KZ</option>
                    </select>
                </div>

                <div class="select-wrapper">
                    <select id="device-filter" class="filter-select">
                        <option value="All">💻 Все устройства</option>
                        <option value="PC">ПК (PC)</option>
                        <option value="PH">Телефон (Phone)</option>
                        <option value="TB">Планшет (Tablet)</option>
                    </select>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" id="retired-checkbox" checked>
                    <span class="custom-checkbox"></span>
                    Показывать Retired в топе (наравне по PTS)
                </label>
            </div>

            <div class="leaderboard-title-sub">OVERALL LEADERBOARD</div>
            <div id="leaderboard-container" class="cards-grid">
                </div>

        </div>

        <div id="testers-screen" class="screen-content hidden">
            <button class="back-btn" onclick="switchScreen('main')">← Назад</button>
            <h2 class="screen-title">Официальные Тестеры</h2>
            
            <div id="testers-list-container">
                </div>
        </div>

        <div id="wiki-screen" class="screen-content hidden">
            <button class="back-btn" onclick="switchScreen('main')">← Назад</button>
            <h2 class="screen-title">Вики — Гайды по режимам</h2>
            
            <div id="wiki-list-container" class="wiki-grid">
                </div>
        </div>

    </main>

    <script>
    function toggleMobileMenu() {
        const menu = document.getElementById('nav-menu');
        if (menu) menu.classList.toggle('active');
    }
    </script>

    <script>
    function loadPlayersScript(url, callback) {
        const script = document.createElement('script');
        const cacheBuster = '?v=' + new Date().getTime();
        script.src = url + cacheBuster;
        script.onload = () => callback(true);
        script.onerror = () => callback(false);
        document.head.appendChild(script);
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadPlayersScript('players/players.js', (success) => {
            if (success && typeof players !== 'undefined') { 
                initSite(); 
            } else {
                loadPlayersScript('players.js', (successRoot) => {
                    if (successRoot && typeof players !== 'undefined') { initSite(); }
                });
            }
        });
    });
    </script>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
